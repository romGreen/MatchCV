
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6200ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c4dcc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="512" fill="url(#bgGradient)"/>
  
  <!-- Main heart shape (larger and more prominent) -->
  <path d="M512 900c-12 0-24-4-32-12-8-8-200-180-200-280 0-66 54-120 120-120 32 0 62 12 84 34 22-22 52-34 84-34 66 0 120 54 120 120 0 100-192 272-200 280-8 8-20 12-32 12z" fill="url(#heartGradient)"/>
  
  <!-- Hobby icons around the heart -->
  <!-- Camera icon (top-left) -->
  <g transform="translate(320, 320)">
    <rect x="0" y="8" width="32" height="24" rx="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="16" cy="20" r="8" fill="#6200ea"/>
    <circle cx="16" cy="20" r="4" fill="#ffffff"/>
    <rect x="12" y="4" width="8" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Music note icon (top-right) -->
  <g transform="translate(640, 320)">
    <circle cx="16" cy="16" r="12" fill="#ffffff" opacity="0.9"/>
    <path d="M8 8 L24 8 M8 12 L20 12 M8 16 L24 16" stroke="#6200ea" stroke-width="2" fill="none"/>
    <circle cx="20" cy="8" r="3" fill="#6200ea"/>
  </g>
  
  <!-- Book icon (bottom-left) -->
  <g transform="translate(320, 640)">
    <rect x="4" y="8" width="24" height="16" rx="2" fill="#ffffff" opacity="0.9"/>
    <path d="M8 12 L20 12 M8 16 L16 16" stroke="#6200ea" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Game controller icon (bottom-right) -->
  <g transform="translate(640, 640)">
    <rect x="4" y="12" width="24" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="10" cy="16" r="2" fill="#6200ea"/>
    <circle cx="22" cy="16" r="2" fill="#6200ea"/>
    <rect x="8" y="8" width="4" height="4" rx="2" fill="#6200ea"/>
    <rect x="16" y="8" width="4" height="4" rx="2" fill="#6200ea"/>
  </g>
  
  <!-- Connection lines from heart to hobby icons -->
  <path d="M512 600 L360 360" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none"/>
  <path d="M512 600 L680 360" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none"/>
  <path d="M512 600 L360 720" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none"/>
  <path d="M512 600 L680 720" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none"/>
  
  <!-- Center connection dot -->
  <circle cx="512" cy="600" r="8" fill="#ffffff"/>
  
  <!-- Subtle sparkles for magic effect -->
  <g opacity="0.7">
    <circle cx="200" cy="200" r="3" fill="#ffffff"/>
    <circle cx="824" cy="200" r="2" fill="#ffffff"/>
    <circle cx="200" cy="824" r="2" fill="#ffffff"/>
    <circle cx="824" cy="824" r="3" fill="#ffffff"/>
    <circle cx="400" cy="150" r="2" fill="#ffffff"/>
    <circle cx="624" cy="150" r="2" fill="#ffffff"/>
    <circle cx="400" cy="874" r="2" fill="#ffffff"/>
    <circle cx="624" cy="874" r="2" fill="#ffffff"/>
  </g>
</svg>
